<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마법학교생활 선택게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4ef; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  #app { width: 100%; max-width: 680px; }

  /* CSS 변수 대체 */
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4ef;
    --bg-tertiary: #eeede8;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b67;
    --border: rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.2);
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #2a2a27;
      --bg-tertiary: #111110;
      --text-primary: #f0efe8;
      --text-secondary: #9a9a94;
      --border: rgba(255,255,255,0.12);
      --border-md: rgba(255,255,255,0.22);
    }
  }

  #game-root { min-height: 520px; }
  .screen { display: none; } .screen.active { display: block; }

  /* LOBBY */
  #lobby { text-align: center; padding: 2.5rem 1.5rem 2rem; background: linear-gradient(160deg, #EEEDFE 0%, #E1F5EE 100%); border-radius: var(--radius-lg); position: relative; }
  .title-main { font-size: 28px; font-weight: 500; color: #3C3489; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 6px; }
  .title-sub { font-size: 13px; color: #534AB7; margin-bottom: 2rem; }
  .stars { font-size: 20px; margin-bottom: 1.5rem; }
  .lobby-btn { display: block; width: 220px; margin: 0 auto 12px; padding: 12px 0; border-radius: 999px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; transition: transform 0.1s; }
  .lobby-btn:active { transform: scale(0.97); }
  .btn-play { background: #534AB7; color: #fff; }
  .btn-chars { background: var(--bg-primary); color: #3C3489; border: 1.5px solid #AFA9EC; }
  .btn-cuts { background: var(--bg-primary); color: #0F6E56; border: 1.5px solid #9FE1CB; }
  .btn-intimacy { background: var(--bg-primary); color: #993C1D; border: 1.5px solid #F5C4B3; }
  .rebirth-btn { position: absolute; top: 12px; right: 12px; background: none; border: 1px solid #F0997B; border-radius: 999px; padding: 5px 12px; font-size: 12px; color: #993C1D; cursor: pointer; transition: background 0.1s; }
  .rebirth-btn:hover { background: #FAECE7; }

  /* MODALS */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 99; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 1.5rem; width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal-step { display: none; } .modal-step.active { display: block; }
  .modal-box p { font-size: 15px; font-weight: 500; margin-bottom: 12px; text-align: center; color: var(--text-primary); }
  .modal-box .sub-p { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; text-align: center; margin-top: -6px; }
  .modal-box input { width: 100%; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-md); font-size: 15px; margin-bottom: 12px; color: var(--text-primary); background: var(--bg-primary); outline: none; }
  .modal-box input:focus { border-color: #534AB7; box-shadow: 0 0 0 2px rgba(83,74,183,0.15); }
  .modal-confirm { width: 100%; padding: 10px; background: #534AB7; color: #fff; border: none; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .gender-btns { display: flex; gap: 8px; margin-bottom: 12px; }
  .gender-btn { flex: 1; padding: 14px 0; border-radius: var(--radius-lg); border: 1.5px solid var(--border-md); background: var(--bg-primary); font-size: 22px; cursor: pointer; transition: border-color 0.1s, background 0.1s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .gender-btn span { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .gender-btn.selected { border-color: #534AB7; background: #EEEDFE; }
  .gender-btn.selected span { color: #534AB7; }
  .gender-warn { display: none; background: #FAEEDA; border: 1px solid #EF9F27; border-radius: var(--radius-md); padding: 8px 10px; font-size: 11px; color: #633806; line-height: 1.5; margin-bottom: 12px; text-align: center; }
  .gender-warn.show { display: block; }
  .rebirth-box, .back-confirm-box { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 1.5rem; width: 280px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .rebirth-box .rebirth-emoji, .back-confirm-box .back-emoji { font-size: 32px; margin-bottom: 10px; }
  .rebirth-box p, .back-confirm-box p { font-size: 14px; color: var(--text-primary); line-height: 1.6; margin-bottom: 8px; }
  .rebirth-box .warn, .back-confirm-box .warn { font-size: 12px; color: #993C1D; margin-bottom: 16px; }
  .rebirth-confirm { width: 100%; padding: 10px; background: #D85A30; color: #fff; border: none; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
  .rebirth-cancel, .back-cancel-btn { width: 100%; padding: 10px; background: none; color: var(--text-secondary); border: 0.5px solid var(--border-md); border-radius: 999px; font-size: 14px; cursor: pointer; }
  .back-go-btn { width: 100%; padding: 10px; background: #534AB7; color: #fff; border: none; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }

  /* ROOMS */
  #chars, #cuts, #intimacy { padding: 1rem; }
  .room-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .back-btn { background: none; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-secondary); }
  .room-title { font-size: 17px; font-weight: 500; color: var(--text-primary); }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .char-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px; text-align: center; }
  .char-avatar { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .char-name { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
  .char-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-bottom: 5px; background: #EEEDFE; color: #3C3489; }
  .char-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
  .cuts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .cut-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 12px; text-align: center; position: relative; }
  .cut-card.unlocked { border-color: #9FE1CB; background: #E1F5EE; }
  .cut-icon { font-size: 28px; margin-bottom: 6px; }
  .cut-name { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
  .cut-name.hidden-text { color: var(--text-secondary); }
  .cut-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-top: 4px; background: #9FE1CB; color: #085041; }
  .cut-locked-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-top: 4px; background: var(--bg-tertiary); color: var(--text-secondary); }
  .new-badge { position: absolute; top: 8px; right: 8px; background: #D85A30; color: #fff; font-size: 9px; font-weight: 500; padding: 2px 6px; border-radius: 999px; }
  .intimacy-list { display: flex; flex-direction: column; gap: 10px; }
  .intimacy-row { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .intimacy-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .intimacy-info { flex: 1; }
  .intimacy-name { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 5px; }
  .intimacy-bar-wrap { background: var(--bg-tertiary); border-radius: 999px; height: 8px; width: 100%; overflow: hidden; }
  .intimacy-bar { height: 8px; border-radius: 999px; background: #534AB7; transition: width 0.4s; }
  .intimacy-num { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .special-ep-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #FAEEDA; color: #854F0B; margin-left: 6px; }

  /* GAME */
  #game { padding: 1rem; }
  .scene-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .scene-header-left { display: flex; flex-direction: column; gap: 2px; }
  .episode-label { font-size: 12px; color: var(--text-secondary); }
  .episode-title { font-size: 16px; font-weight: 500; color: var(--text-primary); }
  .game-back-btn { background: none; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
  .game-back-btn:hover { background: var(--bg-secondary); }
  .scene-box { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 1rem 1.2rem; margin-bottom: 1rem; min-height: 80px; }
  .scene-text { font-size: 14px; color: var(--text-primary); line-height: 1.75; }
  .scene-text .pname { color: #534AB7; font-weight: 500; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .choice-btn { background: var(--bg-primary); border: 0.5px solid var(--border-md); border-radius: var(--radius-lg); padding: 12px 14px; text-align: left; font-size: 13px; cursor: pointer; color: var(--text-primary); transition: background 0.1s; }
  .choice-btn:hover { background: #EEEDFE; border-color: #AFA9EC; }
  .choice-btn.chosen { background: #EEEDFE; border-color: #534AB7; }
  .choice-btn.disabled { opacity: 0.4; pointer-events: none; }
  .result-box { display: none; background: #E1F5EE; border-left: 3px solid #1D9E75; border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 10px 14px; font-size: 13px; color: #085041; line-height: 1.6; margin-bottom: 0.5rem; }
  .result-box.show { display: block; }
  .cut-notify { display: none; background: #E1F5EE; border: 1px solid #5DCAA5; border-radius: var(--radius-md); padding: 8px 12px; font-size: 12px; color: #085041; margin-bottom: 0.5rem; }
  .cut-notify.show { display: block; }
  .sub-choices { display: none; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .sub-choices.show { display: flex; }
  .sub-choice-btn { background: var(--bg-primary); border: 1.5px solid #AFA9EC; border-radius: var(--radius-lg); padding: 10px 14px; text-align: left; font-size: 13px; cursor: pointer; color: #534AB7; font-weight: 500; }
  .sub-choice-btn:hover { background: #EEEDFE; }
  .sub-choice-btn.chosen { background: #EEEDFE; border-color: #534AB7; }
  .sub-choice-btn.disabled { opacity: 0.4; pointer-events: none; }
  .sub-result-box { display: none; background: #E6F1FB; border-left: 3px solid #378ADD; border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 10px 14px; font-size: 13px; color: #0C447C; line-height: 1.6; margin-bottom: 0.5rem; }
  .sub-result-box.show { display: block; }
  .next-btn { background: #534AB7; color: #fff; border: none; border-radius: 999px; padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; display: none; margin-top: 0.5rem; }
  .next-btn.show { display: inline-block; }
  .progress-dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-md); transition: background 0.3s; }
  .dot.done { background: #534AB7; } .dot.current { background: #9F9AE0; }

  /* DAYEND */
  #dayend { padding: 1rem; }
  .dayend-card { background: linear-gradient(160deg, #EEEDFE 0%, #E1F5EE 100%); border-radius: var(--radius-lg); padding: 2rem 1.5rem; text-align: center; margin-bottom: 1rem; }
  .dayend-emoji { font-size: 36px; margin-bottom: 0.75rem; }
  .dayend-title { font-size: 20px; font-weight: 500; color: #3C3489; margin-bottom: 8px; }
  .dayend-msg { font-size: 13px; color: #534AB7; line-height: 1.7; white-space: pre-line; }
  .dayend-next { width: 100%; padding: 13px; background: #534AB7; color: #fff; border: none; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; display: none; margin-bottom: 10px; }
  .dayend-next.show { display: block; }
  .dayend-restart { width: 100%; padding: 13px; background: none; color: #534AB7; border: 1px solid #AFA9EC; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
<div id="game-root">
  <div id="lobby" class="screen active">
    <button class="rebirth-btn" id="rebirth-btn">🔄 환생</button>
    <div class="stars">✦ ✦ ✦</div>
    <div class="title-main">마법학교생활</div>
    <div class="title-main">선택 게임</div>
    <div class="title-sub">당신만의 마법학교 이야기가 시작됩니다</div>
    <button class="lobby-btn btn-play" id="play-btn">▶ 플레이</button>
    <button class="lobby-btn btn-chars" id="chars-btn">👥 인물 소개</button>
    <button class="lobby-btn btn-cuts" id="cuts-btn">✨ 특별컷 룸</button>
    <button class="lobby-btn btn-intimacy" id="intimacy-btn">💛 친밀도 룸</button>
  </div>
  <div id="chars" class="screen">
    <div class="room-header"><button class="back-btn" id="chars-back">← 뒤로</button><span class="room-title">등장인물 소개</span></div>
    <div class="char-grid" id="char-grid"></div>
  </div>
  <div id="cuts" class="screen">
    <div class="room-header"><button class="back-btn" id="cuts-back">← 뒤로</button><span class="room-title">✨ 특별컷 룸</span></div>
    <div class="cuts-grid" id="cuts-grid"></div>
  </div>
  <div id="intimacy" class="screen">
    <div class="room-header"><button class="back-btn" id="intimacy-back">← 뒤로</button><span class="room-title">💛 친밀도 룸</span></div>
    <div class="intimacy-list" id="intimacy-list"></div>
  </div>
  <div id="game" class="screen">
    <div class="scene-header">
      <div class="scene-header-left">
        <div class="episode-label" id="ep-label"></div>
        <div class="episode-title" id="ep-title"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="progress-dots" id="dots"></div>
        <button class="game-back-btn" id="game-back-btn">← 돌아가기</button>
      </div>
    </div>
    <div class="scene-box"><p class="scene-text" id="scene-text"></p></div>
    <div class="choices" id="choices"></div>
    <div class="result-box" id="result-box"></div>
    <div class="cut-notify" id="cut-notify"></div>
    <div class="sub-choices" id="sub-choices"></div>
    <div class="sub-result-box" id="sub-result-box"></div>
    <div class="cut-notify" id="sub-cut-notify"></div>
    <button class="next-btn" id="next-btn">다음 →</button>
  </div>
  <div id="dayend" class="screen">
    <div class="dayend-card">
      <div class="dayend-emoji" id="dayend-emoji">🌙</div>
      <div class="dayend-title" id="dayend-title"></div>
      <div class="dayend-msg" id="dayend-msg"></div>
    </div>
    <button class="dayend-next" id="dayend-next">다음 날로 →</button>
    <button class="dayend-restart" id="dayend-restart">처음으로 돌아가기</button>
  </div>
</div>
</div>

<div id="back-confirm-modal" class="modal-overlay">
  <div class="back-confirm-box">
    <div class="back-emoji">🏠</div>
    <p>로비로 돌아갈까요?</p>
    <div class="warn">진행 상황은 저장되지 않습니다.<br>특별컷·친밀도는 유지됩니다.</div>
    <button class="back-go-btn" id="back-go-btn">돌아가기</button>
    <button class="back-cancel-btn" id="back-cancel-btn">계속 하기</button>
  </div>
</div>

<div id="name-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-step active" id="step-name">
      <p>이름을 입력하세요!</p>
      <input type="text" id="name-input" placeholder="나의 이름..." maxlength="8" />
      <button class="modal-confirm" id="name-next-btn">다음 →</button>
    </div>
    <div class="modal-step" id="step-gender">
      <p>성별을 선택하세요!</p>
      <p class="sub-p" id="gender-sub"></p>
      <div class="gender-btns">
        <button class="gender-btn" id="gender-male" data-gender="male">👦<span>남자</span></button>
        <button class="gender-btn" id="gender-female" data-gender="female">👧<span>여자</span></button>
        <button class="gender-btn" id="gender-other" data-gender="other">🧒<span>기타</span></button>
      </div>
      <div class="gender-warn" id="gender-warn">⚠ 주의 ⚠ : 성별을 기타로 설정하면 특별 에피소드 몇 개를 볼 수 없습니다</div>
      <button class="modal-confirm" id="gender-confirm-btn">시작하기</button>
    </div>
  </div>
</div>

<div id="rebirth-modal" class="modal-overlay">
  <div class="rebirth-box">
    <div class="rebirth-emoji">🔄</div>
    <p>환생하면 새로운 삶이 시작됩니다.</p>
    <div class="warn">특별컷과 친밀도가 모두 초기화됩니다!</div>
    <button class="rebirth-confirm" id="rebirth-confirm">환생하기</button>
    <button class="rebirth-cancel" id="rebirth-cancel">취소</button>
  </div>
</div>

<script>
(function(){

var CHARS=[
  {name:"시루아",emoji:"🐱",tag:"동물변신 마법",color:"#FAECE7",tcolor:"#993C1D",desc:"붉은 머리카락과 고양이 귀·꼬리. 밝고 친절한 여학생."},
  {name:"루카",emoji:"💧",tag:"물·산소 마법",color:"#E6F1FB",tcolor:"#185FA5",desc:"파란 단정한 머리, 흰 목도리. 조용한 남학생. 아르의 단짝."},
  {name:"헤이슨",emoji:"🧡",tag:"마음읽기 마법",color:"#FAEEDA",tcolor:"#854F0B",desc:"갈색 포니테일. 활발하고 덤벙거리는 장난꾸러기 남학생."},
  {name:"크리아",emoji:"⚡",tag:"전기생성 마법",color:"#FAEEDA",tcolor:"#854F0B",desc:"노란 긴 머리, 흰 큰 리본. 소심하고 부끄러움 많은 여학생."},
  {name:"아르",emoji:"🔥",tag:"불·시간 마법",color:"#FAECE7",tcolor:"#993C1D",desc:"검은 머리, 노란 눈동자, 회중시계. 조용하고 친절한 남학생. 루카의 단짝."},
  {name:"유츠미",emoji:"🐺",tag:"치유·눈[Snow] 마법",color:"#E6F1FB",tcolor:"#185FA5",desc:"흰 단발, 은빛 늑대 귀와 꼬리. 도도하고 조용한 반수인 여학생."},
  {name:"미챠 선생님",emoji:"📚",tag:"담임 선생님",color:"#EEEDFE",tcolor:"#3C3489",desc:"긴 검은 머리, 흰테 안경. 친절하고 똑똑한 담임 선생님."},
  {name:"교장 선생님",emoji:"🌟",tag:"교장 선생님",color:"#E1F5EE",tcolor:"#0F6E56",desc:"길게 묶은 푸른빛 포니테일. 친절하고 예쁜 교장 선생님."},

function unlockCut(id,notifyEl){
  var cut=SPECIAL_CUTS.find(function(c){return c.id===id;});

}

  {label:"에피소드 7",title:"집에 가는 길 — 아르와 루카",scene:function(n){return'오늘은 2째날이라 신기하게도 3교시로 끝낸다고 합니다..! (정말 놀랍) 집에 가고 있는데 옆에서 아르와 루카가 수다를 떨고 있는 게 보입니다. <span class="pname">'+n+'</span>, 말을 걸어볼까요?';},choices:[{text:'🔥 말을 건다. "안녕? 우리 길이 똑같네." (아르에게)',result:function(){return'"... 도서관 가는거야." 아르가 조용히 대답하곤 루카와 함께 뛰어갑니다.';}},{text:'💧 말을 건다. "안녕? 우리 길이 똑같네." (루카에게)',result:function(n){return talkedToLukaHello?'"오, 안녕. '+n+'. 나 아르랑 도서관 가야해서... 잘있어." 소심하게 대답을 건넨 루카는 아르와 함께 자리를 벗어납니다.':'"그러네. 오해하지마. 도서관 가는거니까." 루카가 대답하곤 빠른 걸음으로 자리에서 벗어납니다.';}},{text:"😶 무시한다",result:function(){return"아무 일도 없었습니다...";}}]},
  {label:"에피소드 8",title:"저녁 식사 — 어디서 먹을까?",scene:function(n){return'3교시에 학교가 끝나서 배고픈 <span class="pname">'+n+'</span>, 음식점에서 밥을 먹으려고 합니다. 어디서 먹을까요?';},choices:[
    {text:"🌶️ 매콤분식",result:function(){return'핵매운 떡볶이를 주문해서 먹고 있는데... "으아!!!! 너무 매워!!" 결국 떡볶이를 포기하고 어묵과 김밥을 먹습니다.';}},
    {text:"🍱 지윤네 돈가스",result:function(){return'돈가스를 시키고 자리에 앉았는데... \'딸랑딸랑\' \'유, 유츠미..!(속으로)\' 유츠미가 들어왔습니다. 둘은 서로를 모른 척 하고 어색하게 먹습니다,,,';  }},
    {text:"🥩 할아버지 보쌈",result:function(){return'보쌈을 맛있게 먹고 있는데... 주변을 둘러보니 온통 할머니 할아버지밖에 없습니다. 뻘쭘하게 보쌈을 먹고 나옵니다...';}}
  ]}
];}

function showScreen(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});document.getElementById(id).classList.add("active");}
function showChars(){document.getElementById("char-grid").innerHTML=CHARS.map(function(c){return'<div class="char-card"><div class="char-avatar" style="background:'+c.color+'">'+c.emoji+'</div><div class="char-name">'+c.name+'</div><div class="char-tag" style="background:'+c.color+';color:'+c.tcolor+'">'+c.tag+'</div><div class="char-desc">'+c.desc+'</div></div>';}).join("");showScreen("chars");}
function showCuts(){document.getElementById("cuts-grid").innerHTML=SPECIAL_CUTS.map(function(c){return'<div class="cut-card'+(c.unlocked?' unlocked':'')+'">'+( c.newFlag?'<div class="new-badge">NEW</div>':'')+' <div class="cut-icon">'+c.emoji+'</div><div class="cut-name'+(c.unlocked?'':' hidden-text')+'">'+(c.unlocked?c.char+' - '+c.name:c.char+' - '+'*'.repeat(c.name.length))+'</div>'+(c.unlocked?'<div class="cut-badge">해금 완료</div>':'<div class="cut-locked-badge">🔒 미해금</div>')+'</div>';}).join("");SPECIAL_CUTS.forEach(function(c){c.newFlag=false;});showScreen("cuts");}
function showIntimacy(){document.getElementById("intimacy-list").innerHTML=INTIMACY_CHARS.map(function(c){var val=INTIMACY[c.name]||0,pct=(val/5)*100,atMax=val>=5;return'<div class="intimacy-row"><div class="intimacy-avatar" style="background:'+c.color+'">'+c.emoji+'</div><div class="intimacy-info"><div class="intimacy-name">'+c.name+(atMax?'<span class="special-ep-tag">특별 에피소드 해금!</span>':'')+'</div><div class="intimacy-bar-wrap"><div class="intimacy-bar" style="width:'+pct+'%"></div></div></div><div class="intimacy-num">'+val+' / 5</div></div>';}).join("");showScreen("intimacy");}

function openNameModal(){
  document.getElementById("step-name").classList.add("active");
  document.getElementById("step-gender").classList.remove("active");
  selectedGender=null;
  document.querySelectorAll(".gender-btn").forEach(function(b){b.classList.remove("selected");});
  document.getElementById("gender-warn").classList.remove("show");
  document.getElementById("name-modal").classList.add("open");
  setTimeout(function(){document.getElementById("name-input").focus();},50);
}
document.getElementById("name-next-btn").addEventListener("click",function(){
  var v=document.getElementById("name-input").value.trim();if(!v)return;
  document.getElementById("gender-sub").textContent='"'+v+'"의 성별을 선택해 주세요!';
  document.getElementById("step-name").classList.remove("active");
  document.getElementById("step-gender").classList.add("active");
});
document.getElementById("name-input").addEventListener("keydown",function(e){
  if(e.key==="Enter"){var v=document.getElementById("name-input").value.trim();if(!v)return;
    document.getElementById("gender-sub").textContent='"'+v+'"의 성별을 선택해 주세요!';
    document.getElementById("step-name").classList.remove("active");
    document.getElementById("step-gender").classList.add("active");}
});
document.querySelectorAll(".gender-btn").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".gender-btn").forEach(function(b){b.classList.remove("selected");});
    btn.classList.add("selected");selectedGender=btn.getAttribute("data-gender");
    document.getElementById("gender-warn").classList[selectedGender==="other"?"add":"remove"]("show");
  });
});
document.getElementById("gender-confirm-btn").addEventListener("click",function(){if(!selectedGender)return;startGame();});

function startGame(){
  var v=document.getElementById("name-input").value.trim();
  playerName=v||"나";playerGender=selectedGender||"other";
  document.getElementById("name-modal").classList.remove("open");
  currentEp=0;currentDay=0;chosen=false;
  exploredFloor2=false;exploredFloor3=false;talkedToSirua=false;
  chosenMagic="순간이동";saidYesToSoccer=false;
  calledPrincipal=false;visitedPrincipal=false;talkedToLukaHello=false;
  ALL_DAYS=[makeDay1(),makeDay2()];
  loadEpisode();showScreen("game");
}

function getEp(){var ep=ALL_DAYS[currentDay][currentEp];if(ep&&ep.isBranched)return saidYesToSoccer?ep5Soccer:ep5Normal;return ep;}
function loadEpisode(){
  chosen=false;var ep=getEp();
  document.getElementById("ep-label").textContent=DAY_TITLES[currentDay]+" · "+ep.label;
  document.getElementById("ep-title").textContent=ep.title;
  document.getElementById("scene-text").innerHTML=ep.scene(playerName);
  document.getElementById("choices").innerHTML=ep.choices.map(function(c,i){return'<button class="choice-btn" data-idx="'+i+'">'+c.text+'</button>';}).join("");
  document.querySelectorAll(".choice-btn").forEach(function(btn){btn.addEventListener("click",function(){choose(parseInt(btn.getAttribute("data-idx")));});});
  document.getElementById("result-box").classList.remove("show");
  document.getElementById("cut-notify").classList.remove("show");document.getElementById("cut-notify").innerHTML="";
  document.getElementById("sub-choices").classList.remove("show");document.getElementById("sub-choices").innerHTML="";
  document.getElementById("sub-result-box").classList.remove("show");
  document.getElementById("sub-cut-notify").classList.remove("show");document.getElementById("sub-cut-notify").innerHTML="";
  document.getElementById("next-btn").classList.remove("show");
  renderDots();
}
function renderDots(){document.getElementById("dots").innerHTML=ALL_DAYS[currentDay].map(function(_,i){return'<div class="dot '+(i<currentEp?'done':i===currentEp?'current':'')+'"></div>';}).join("");}
function choose(idx){
  if(chosen)return;chosen=true;var ep=getEp();
  if(ep.choices[idx].onChoose)ep.choices[idx].onChoose();
  document.querySelectorAll(".choice-btn").forEach(function(b,i){b.classList.add("disabled");if(i===idx)b.classList.add("chosen");});
  document.getElementById("result-box").innerHTML="✅ "+ep.choices[idx].result(playerName);
  document.getElementById("result-box").classList.add("show");
  if(ep.choices[idx].subChoices){
    var sc=document.getElementById("sub-choices"),subs=ep.choices[idx].subChoices;
    sc.innerHTML=subs.map(function(s,i){return'<button class="sub-choice-btn" data-sidx="'+i+'">'+s.text+'</button>';}).join("");
    sc.classList.add("show");
    sc.querySelectorAll(".sub-choice-btn").forEach(function(btn){btn.addEventListener("click",function(){
      var sidx=parseInt(btn.getAttribute("data-sidx"));
      sc.querySelectorAll(".sub-choice-btn").forEach(function(b,i){b.classList.add("disabled");if(i===sidx)b.classList.add("chosen");});
      if(subs[sidx].onChoose)subs[sidx].onChoose();
      document.getElementById("sub-result-box").innerHTML="💬 "+subs[sidx].result(playerName);
      document.getElementById("sub-result-box").classList.add("show");
      document.getElementById("next-btn").classList.add("show");
    });});
  } else {document.getElementById("next-btn").classList.add("show");}
}
function nextEpisode(){if(currentEp<ALL_DAYS[currentDay].length-1){currentEp++;loadEpisode();}else showDayEnd();}
function showDayEnd(){
  var t=DAY_TITLES[currentDay];
  document.getElementById("dayend-emoji").textContent=currentDay===0?"🌙":"⭐";
  document.getElementById("dayend-title").textContent=playerName+"의 "+t+"이 끝났습니다!";
  document.getElementById("dayend-msg").textContent="마법학교 "+t+"이 무사히 지나갔습니다.\n내일은 또 어떤 일이 기다리고 있을까요?";
  var nb=document.getElementById("dayend-next");
  if(currentDay<ALL_DAYS.length-1){nb.textContent=DAY_TITLES[currentDay+1]+"로 넘어가기 →";nb.classList.add("show");}
  else nb.classList.remove("show");
  showScreen("dayend");
}
function goNextDay(){currentDay++;currentEp=0;loadEpisode();showScreen("game");}

document.getElementById("game-back-btn").addEventListener("click",function(){document.getElementById("back-confirm-modal").classList.add("open");});
document.getElementById("back-cancel-btn").addEventListener("click",function(){document.getElementById("back-confirm-modal").classList.remove("open");});
document.getElementById("back-go-btn").addEventListener("click",function(){document.getElementById("back-confirm-modal").classList.remove("open");document.getElementById("name-input").value="";showScreen("lobby");});
document.getElementById("play-btn").addEventListener("click",openNameModal);
document.getElementById("chars-btn").addEventListener("click",showChars);
document.getElementById("cuts-btn").addEventListener("click",showCuts);
document.getElementById("intimacy-btn").addEventListener("click",showIntimacy);
document.getElementById("chars-back").addEventListener("click",function(){showScreen("lobby");});
document.getElementById("cuts-back").addEventListener("click",function(){showScreen("lobby");});
document.getElementById("intimacy-back").addEventListener("click",function(){showScreen("lobby");});
document.getElementById("next-btn").addEventListener("click",nextEpisode);
document.getElementById("dayend-next").addEventListener("click",goNextDay);
document.getElementById("dayend-restart").addEventListener("click",function(){document.getElementById("name-input").value="";showScreen("lobby");});
document.getElementById("rebirth-btn").addEventListener("click",function(){document.getElementById("rebirth-modal").classList.add("open");});
document.getElementById("rebirth-cancel").addEventListener("click",function(){document.getElementById("rebirth-modal").classList.remove("open");});
document.getElementById("rebirth-confirm").addEventListener("click",function(){resetPersistent();document.getElementById("rebirth-modal").classList.remove("open");document.getElementById("name-input").value="";});

})();
</script>
</body>
